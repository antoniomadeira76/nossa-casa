name: Testes e publicação

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test

  publicar:
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # O workflow anterior falhava aqui: sem estas permissões o token não pode
    # escrever no Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # E faltava isto: publicava ./dist sem nunca o construir, e dist/ está no
      # .gitignore — portanto em CI não existia. A saída de compilação constrói-se
      # aqui, não se versiona.
      - name: Construir a versão web
        run: npx expo export --platform web --output-dir dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: publicacao
        uses: actions/deploy-pages@v4
